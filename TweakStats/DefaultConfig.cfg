# Tweak Stats
#
# Changes the stats of items, recipes, creatures, build pieces and status effects. Everything in this file is read
# again as soon as it is saved, so there's no need to restart Valheim. Lines starting with # are comments - remove the
# # from an example to use it.
#
# How to write this file: https://github.com/kriona/valheim/tree/main/TweakStats
#
# Every name: https://github.com/kriona/valheim/blob/main/TweakStats/NAMES.md
# Every stat that can be changed: https://github.com/kriona/valheim/blob/main/TweakStats/STATS.md
#
# ---------------------------------------------------------------------------------------------------------------------
# Sections
#
#   [SwordIron]           An item, by its prefab name
#   [SwordIron, AxeIron]  Several items
#   [Sword*]              Items whose prefab name matches - * matches any text and ? any one letter
#   [Skill:Swords]        Every item that uses a skill
#   [Type:Shield]         Every item of a type
#   [Recipe:SwordIron]    The recipe that makes an item
#   [Creature:Troll]      A creature
#   [Piece:woodwall]      A build piece
#   [Effect:Rested]       A status effect
#
# ---------------------------------------------------------------------------------------------------------------------
# Multiplayer
#
# When the server has Tweak Stats, every player who joins uses the server's config file, and this file is ignored while
# you're on it. Hosting a world from the start menu counts as a server: this file is sent to the players who join you.
#
# When the server doesn't have Tweak Stats, this file is used, but these sections are skipped:
#   [Creature:...]        Every creature
#   [Piece:...]           Every build piece
#   [Effect:...]          Effects that land on creatures - Burning, Poison, Frost, Harpooned and any effect a weapon
#                         or creature attack gives what it hits. Other effects, like Rested, still apply
# A message says how many were skipped when you join, and BepInEx\LogOutput.log lists them.
#
# A server can refuse players who don't have Tweak Stats, or who have a different version - the first two numbers have
# to match, so 1.2.0 and 1.2.3 can play together:
#
#   [Settings]
#   requireMod = auto     Requires the mod when this file has Creature, Piece or Effect sections - the default
#   requireMod = true     Always requires the mod
#   requireMod = false    Lets anyone join. A player without the mod runs the creatures and build pieces near them
#                         with the game's own values
#
# Creatures, pieces and equipment already in the world change as soon as this file is saved, including the effects of
# equipment being worn. Any other effect that's already running, like Rested, keeps its old values until it ends.
#
# ---------------------------------------------------------------------------------------------------------------------
# Finding names
#
# The tweakstats console command (press F5) helps find names:
#   tweakstats find troll         Finds the sections for anything whose name contains the text, e.g. [Creature:Troll]
#   tweakstats inventory          Lists the items you're carrying with their names and main stats
#   tweakstats world              Shows the world's name and ID and the server's address, for [Worlds: ...] groups
#   tweakstats dump SwordIron     Writes every stat of a section with its value to kriona.TweakStats.dump.txt
#   tweakstats list               Writes every name to kriona.TweakStats.names.md. Only needed if you are using a mod that adds new items / recipes
#
# ---------------------------------------------------------------------------------------------------------------------
# Values
#
#   weight = 5       Sets the stat to 5
#   weight = +5      Adds 5
#   weight = -5      Subtracts 5
#   weight = 1.5x    Multiplies by 1.5
#   weight = =-5     Sets the stat to -5 - a negative number needs = in front, or it subtracts
#
# Stats that aren't numbers are set to a value: true or false, a choice like Resistant, or a name like Burning.
#
# A few values are kept inside what the game can handle without freezing, crashing or damaging your save - like a
# maxStackSize of at most 65535 - and the log says when a value is changed to fit. The README lists the limits.
#
# ---------------------------------------------------------------------------------------------------------------------
# Order
#
# Every section that names an item applies to it, from the top of the file down. Put broad sections like [Skill:Swords]
# first and specific ones like [SwordIron] after them.
#
# ---------------------------------------------------------------------------------------------------------------------
# Worlds
#
# Sections between [Worlds: ...] and [/Worlds] only apply on those worlds. List world names, world IDs, server
# addresses like 203.0.113.5 or 203.0.113.5:2456, or SinglePlayer for a world started without letting other players
# join. The tweakstats world console command shows the name, ID and address to use where you're playing.
#
#   [Worlds: SinglePlayer, Midgard, 203.0.113.5]
#   [SwordIron]
#   damages.slash = 2x
#   [/Worlds]
#
# =====================================================================================================================
# Examples
# =====================================================================================================================

# --- One stat ---
#[SwordIron]
#weight = 0.5

# --- Add to and multiply stats ---
#[SwordIron]
#damages.slash = 1.5x                 # 1.5 times the slash damage
#damages.fire = +10                   # Adds 10 fire damage
#damagesPerLevel.slash = +2           # Each upgrade adds 2 more slash damage than it did
#maxDurability = 2x

# --- Every damage type at once ---
#[SwordIron]
#damages = 1.25x                      # Slash, fire, chop and every other damage type

# --- Attacks ---
#[SwordIron]
#attack.attackStamina = -4            # The normal attack costs 4 less stamina
#secondaryAttack.damageMultiplier = 3 # The special attack does 3 times the damage

# --- Several items, and every item of a skill or type ---
#[SwordIron, AxeIron]
#durabilityPerLevel = 2x

#[Sword*]
#backstabBonus = +1

#[Skill:Bows]
#attack.projectileVel = 1.2x          # Arrows fly 20% faster

#[Type:Shield]
#blockPower = 1.2x

# --- Broad first, then specific ---
#[Skill:Swords]
#damages = 1.2x
#[SwordIron]
#damages.slash = +10                  # The Iron sword gets the 1.2x above, then +10 slash

# --- Armor ---
#[ArmorBronzeChest]
#armor = +4
#armorPerLevel = +1
#movementModifier = 0                 # No movement penalty
#damageModifiers.Frost = Resistant    # Adds frost resistance
#equipStatusEffect = none             # Removes the effect the armor gives while worn

# --- Food ---
#[CookedMeat]
#food = 1.5x                          # Health
#foodStamina = 1.5x
#foodBurnTime = 2x                    # Lasts twice as long

# --- Everyday items ---
#[Wood, Stone]
#maxStackSize = 100                   # Lowering it again later deletes whatever is over the new size

#[Iron, IronOre, IronScrap]
#teleportable = true

# --- Recipes ---
#[Recipe:SwordIron]
#resources.Iron = 10                  # Costs 10 iron to craft
#resources.Iron.amountPerLevel = 5    # and 5 more for each upgrade
#resources.LeatherScraps = 0          # Doesn't need leather scraps
#resources.Bronze = 2                 # Needs 2 bronze, which it didn't before
#minStationLevel = 1                  # Can be made at a level 1 forge

#[Recipe:ArrowWood]
#amount = 40                          # Makes 40 arrows at a time

# --- Creatures ---
#[Creature:Troll]
#health = 2x
#runSpeed = 0.8x
#damageModifiers.fire = Weak          # Fire does 50% more damage to it
#drops.TrollHide = 1                  # Always drops troll hide
#drops.TrollHide.amountMax = 10
#drops.Coins = 0.5                    # Drops coins half the time, which it didn't before
#attacks.damages = 0.75x              # Every attack does 25% less damage

#[Creature:Greydwarf*]
#viewRange = 0.5x                     # Every kind of greydwarf sees half as far

# --- Build pieces ---
#[Piece:woodwall]
#health = 2x
#resources.Wood = 1                   # Costs 1 wood

#[Piece:piece_chest_wood]
#width = 6                            # A wood chest has 6 columns - making it smaller again drops the items in the lost slots on the ground

#[Piece:fire_pit, Piece:bonfire, Piece:hearth]
#infiniteFuel = true

#[Piece:smelter]
#maxOre = 20
#secPerProduct = 0.5x                 # Smelts twice as fast

# --- Status effects ---
#[Effect:Rested]
#ttl = 2x                             # Lasts twice as long

#[Effect:BeltStrength]
#addMaxCarryWeight = 300              # Megingjord adds 300 carry weight

# --- Only on some worlds ---
#[Worlds: SinglePlayer]
#[Skill:Pickaxes]
#damages.pickaxe = 2x
#[/Worlds]
